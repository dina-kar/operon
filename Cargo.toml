[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["The Operon Authors"]

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
crc32c = "0.6"
foyer = "0.22"
futures = "0.3"
moka = { version = "0.12", features = ["future"] }
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "fs"] }
proptest = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
url = "2"
operon-store = { path = "crates/operon-store", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
