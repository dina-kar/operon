[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["The Operon Authors"]

[workspace.dependencies]
anyhow = "1"
arrow = "58.4"
arrow-array = "58.4"
arrow-flight = { version = "58.4", features = ["flight-sql-experimental"] }
arrow-schema = "58.4"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bitpacking = "0.9.3"
bytes = "1"
bytesize = "2.4"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
datafusion = "54.1"
fail = "0.5"
fnv = "1"
foyer = "0.22"
futures = "0.3"
hex = "0.4"
http = "1"
humantime = "2"
indexmap = { version = "2", features = ["serde"] }
itertools = "0.14"
kafka-protocol = { version = "0.18", default-features = false }
lance = { version = "=12.0.0", default-features = false }
lance-file = { version = "=12.0.0", default-features = false }
lance-index = { version = "=12.0.0", default-features = false }
lance-io = { version = "=12.0.0", default-features = false }
lance-linalg = { version = "=12.0.0", default-features = false }
lance-table = { version = "=12.0.0", default-features = false }
moka = { version = "0.12", features = ["future"] }
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "fs"] }
once_cell = "1"
openraft = { version = "=0.10.0-alpha.34", default-features = false, features = ["serde", "tokio-rt"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
proptest = "1"
prost = "0.14"
prost-build = "0.14"
qdrant-edge = "=0.8.0"
rand = "0.9"
rand_chacha = "0.9"
redb = "4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rmcp = { version = "3.4.1", features = ["server", "transport-streamable-http-server"] }
roaring = "0.11"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_json_borrow = "0.9"
serde_with = "3"
slatedb = { version = "0.16", default-features = false }
tantivy = { version = "=0.26.2", default-features = false, features = ["quickwit", "mmap", "stopwords", "stemmer", "lz4-compression", "zstd-compression", "columnar-zstd-compression"] }
tantivy-fst = "0.5"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["std", "formatting", "parsing", "macros"] }
time-fmt = "0.3.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
tonic = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
unicode-segmentation = "1.13"
url = "2"
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
operon-cache = { path = "crates/operon-cache", version = "0.0.1" }
operon-collection = { path = "crates/operon-collection", version = "0.0.1" }
operon-common = { path = "crates/operon-common", version = "0.0.1" }
operon-link = { path = "crates/operon-link", version = "0.0.1" }
operon-log = { path = "crates/operon-log", version = "0.0.1" }
operon-meta = { path = "crates/operon-meta", version = "0.0.1" }
operon-meta-conformance = { path = "crates/operon-meta-conformance", version = "0.0.1" }
operon-pk = { path = "crates/operon-pk", version = "0.0.1" }
operon-query = { path = "crates/operon-query", version = "0.0.1" }
operon-quickwit = { path = "crates/operon-quickwit", version = "0.0.1" }
operon-store = { path = "crates/operon-store", version = "0.0.1" }
operon-text = { path = "crates/operon-text", version = "0.0.1" }
operon-worker = { path = "crates/operon-worker", version = "0.0.1" }

[profile.dev]
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
