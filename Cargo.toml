[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["The Loams Authors"]

[workspace.dependencies]
anyhow = "1"
arrow = "58.4"
arrow-array = "58.4"
arrow-flight = { version = "58.4", features = ["flight-sql-experimental"] }
arrow-schema = "58.4"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
bitpacking = "0.9.3"
buffa = "0.9.2"
bytes = "1"
bytesize = "2.4"
clap = { version = "4", features = ["derive"] }
# The Loams Live sync API (R1 plan Task 7, row R12). Crates add `axum` (the
# server, Task 12); loams-live-proto's `client` feature adds `client`.
connectrpc = "0.9.1"
connectrpc-build = "0.9"
# `grpc.health.v1` and `grpc.reflection.v1` on the main port (design §44 §4,
# API1 Task 1). Both default their `client` transport off: the server does not
# need it.
connectrpc-health = { version = "0.9.0", default-features = false }
connectrpc-reflection = { version = "0.9.0", default-features = false }
# CRC-16 of Loams Live document ids (R1 plan Task 8).
# The Arm A WAL data path (§28 §7.2, D263): thread-per-core, io_uring.
compio = { version = "0.19.2", default-features = false, features = ["runtime", "io-uring", "polling", "net", "fs", "io", "time"] }
crc = "3"
crc32c = "0.6"
# Crockford base32 of Loams Live document ids (R1 plan Task 8).
data-encoding = "2"
# Lance's feature set (no parquet or compression): adding loams-query does
# not rebuild DataFusion for the workspace.
datafusion = { version = "54.1", default-features = false, features = [
    "crypto_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "nested_expressions",
    "regex_expressions",
    "sql",
    "string_expressions",
    "unicode_expressions",
] }
# PostgreSQL wire access over collections (loams feature `pgwire`, PG1).
datafusion-postgres = "0.18"
fail = "0.5"
fnv = "1"
foyer = "0.22"
futures = "0.3"
hex = "0.4"
http = "1"
http-body = "1"
httpmock = { version = "0.8.3", default-features = false, features = ["remote"] }
humantime = "2"
indexmap = { version = "2", features = ["serde"] }
itertools = "0.15"
kafka-protocol = { version = "0.18", default-features = false }
lance = { version = "=12.0.0", default-features = false }
lance-file = { version = "=12.0.0", default-features = false }
lance-index = { version = "=12.0.0", default-features = false }
lance-io = { version = "=12.0.0", default-features = false }
lance-linalg = { version = "=12.0.0", default-features = false }
lance-table = { version = "=12.0.0", default-features = false }
moka = { version = "0.12", features = ["future"] }
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "fs"] }
once_cell = "1"
openraft = { version = "=0.10.0-alpha.34", default-features = false, features = ["serde", "tokio-rt"] }
# The MySQL wire listener over collections (loams feature `mysql-wire`).
# No `tls`: the listener is loopback-only, and that feature pulls rustls 0.22.
opensrv-mysql = { version = "0.7", default-features = false }
# Bulk import (D1 Task 8): Parquet over object_store, on the workspace's arrow 58.
parquet = { version = "58", default-features = false, features = ["arrow", "async", "object_store", "snap", "zstd", "lz4"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
proptest = "1"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
qdrant-edge = "=0.8.0"
rand = "0.9"
rand_chacha = "0.9"
redb = "4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# Resonate, embedded by loams-durable (D1, D140): the fork ostrium-labs/resonate,
# branch loam/0.10.1 = upstream 28dfd01 + PR 0c (#1164), the gcp-idtoken
# feature, PR 0a (#1162), PR 1 (#1163) and the SDK's reqwest defaults as a
# feature. Pinned by rev only; a bump compares each 0001_initial.sql with the
# pinned one and says in its PR when existing durable stores must be dropped
# (D1 plan X11). Never add resonate-server-scylladb or the NATS packages
# (BUSL-1.1 lineage).
resonate-base = { git = "https://github.com/ostrium-labs/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
resonate-server-blob = { git = "https://github.com/ostrium-labs/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
resonate-core = { git = "https://github.com/ostrium-labs/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
resonate-gateway-http = { git = "https://github.com/ostrium-labs/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
resonate-plugin = { git = "https://github.com/ostrium-labs/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
# The package is resonate-sdk (lib resonate_sdk); `resonate` in that repository
# is the server binary. Its reqwest defaults (TLS, charset, system proxy) are
# off: Loams talks to the server in process.
resonate-sdk = { git = "https://github.com/ostrium-labs/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a", default-features = false }
resonate-server-mysql = { git = "https://github.com/ostrium-labs/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
resonate-server-sqlite = { git = "https://github.com/ostrium-labs/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
resonate-transport-http-poll = { git = "https://github.com/ostrium-labs/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
# Without gcp-idtoken: no google-cloud-auth, and auth.mode = "gcp" is refused.
resonate-transport-http-push = { git = "https://github.com/ostrium-labs/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a", default-features = false }
rmcp = { version = "3.4.1", features = ["server", "transport-streamable-http-server"] }
roaring = "0.11"
rustc-hash = "2"
rustix = { version = "1", default-features = false, features = ["std"] }
# The TLS library under sqlx (0.23, ring): loams-durable sets the process
# default crypto provider when none is set (D1 Task 5, T5-4).
rustls = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: qdrant-edge needs it, and Cargo unifies features, so the
# whole workspace uses one insertion-ordered map type (M1.3 row E58).
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
serde_json_borrow = "0.9"
serde_with = "3"
sha2 = "0.11"
slatedb = { version = "0.17", default-features = false }
# The MySQL driver resonate-server-mysql uses (0.8.6, rustls); loams-durable
# checks a TiDB store's schema with it before serving (D1 Task 4).
sqlx = { version = "0.9.0", default-features = false }
tantivy = { version = "=0.26.2", default-features = false, features = ["quickwit", "mmap", "stopwords", "stemmer", "lz4-compression", "zstd-compression", "columnar-zstd-compression"] }
tantivy-fst = "0.5"
tempfile = "3"
thiserror = "2"
# Loams's fork of tikv/client-rust, pinned by rev: branch `loam` of
# ostrium-labs/client-rust, upstream ab4be1c plus the TSO stream reconnect, the
# public generated protos, async-commit lock resolution on the read path and
# async commit's max_commit_ts (docs/plans/r1-dependency-spike.md, "The
# client-rust fork"). Not crates.io 0.4.0: it fails cargo-deny's advisories
# through tonic 0.10 and reports lost async-commit and 1PC acknowledgements as
# plain errors (R1 plan row R4). Default features pull in openssl, procfs and
# protobuf 2 through prometheus. The pin moves only by a PR that reruns the
# loams-tikv, loams-meta-tikv and loams-live suites.
tikv-client = { git = "https://github.com/ostrium-labs/client-rust", rev = "1f8962b00b33ebc6f34b72d6c52d08b8a8e1906e", default-features = false }
time = { version = "0.3", features = ["std", "formatting", "parsing", "macros"] }
time-fmt = "0.3.8"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
# The WebSocket client for loams-sidebar-browser's CDP transport. Obscura
# exposes its DevTools endpoint as `ws://127.0.0.1:<port>/devtools/browser`
# and nothing else, and `obscura-cdp` is not published to crates.io (D620),
# so the engine is reached over the wire rather than as a library. `connect`
# and `handshake` only: the endpoint is loopback plaintext by design
# (`--host` defaults to 127.0.0.1), so no TLS stack is pulled in.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
tokio-util = { version = "0.7", default-features = false }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
unicode-segmentation = "1.13"
url = "2"
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.14"
loams-cache = { path = "crates/loams-cache", version = "0.0.1" }
loams-collection = { path = "crates/loams-collection", version = "0.0.1" }
loams-cloudevents = { path = "crates/loams-cloudevents", version = "0.0.1" }
loams-common = { path = "crates/loams-common", version = "0.0.1" }
loams-durable = { path = "crates/loams-durable", version = "0.0.1" }
loams-es = { path = "crates/loams-es", version = "0.0.1" }
loams-hnsw = { path = "crates/loams-hnsw", version = "0.0.1" }
loams-hot = { path = "crates/loams-hot", version = "0.0.1" }
loams-link = { path = "crates/loams-link", version = "0.0.1" }
loams-live = { path = "crates/loams-live", version = "0.0.1" }
loams-live-proto = { path = "crates/loams-live-proto", version = "0.0.1" }
# The public `loams.*.v1` packages of the unified Connect API and their
# descriptor set for reflection (design §44, API1 Task 1).
loams-proto = { path = "crates/loams-proto", version = "0.0.1" }
loams-log = { path = "crates/loams-log", version = "0.0.1" }
loams-meta = { path = "crates/loams-meta", version = "0.0.1" }
loams-meta-conformance = { path = "crates/loams-meta-conformance", version = "0.0.1" }
loams-meta-tikv = { path = "crates/loams-meta-tikv", version = "0.0.1" }
loams-stream-grpc = { path = "crates/loams-stream-grpc", version = "0.0.1" }
loams-pk = { path = "crates/loams-pk", version = "0.0.1" }
loams-qdrant = { path = "crates/loams-qdrant", version = "0.0.1" }
loams-query = { path = "crates/loams-query", version = "0.0.1" }
loams-quickwit = { path = "crates/loams-quickwit", version = "0.0.1" }
loams-store = { path = "crates/loams-store", version = "0.0.1" }
loams-text = { path = "crates/loams-text", version = "0.0.1" }
loams-tikv = { path = "crates/loams-tikv", version = "0.0.1" }
loams-worker = { path = "crates/loams-worker", version = "0.0.1" }

[profile.dev]
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
