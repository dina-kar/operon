[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["The Operon Authors"]

[workspace.dependencies]
anyhow = "1"
arrow = "58.4"
arrow-array = "58.4"
arrow-flight = { version = "58.4", features = ["flight-sql-experimental"] }
arrow-schema = "58.4"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bitpacking = "0.9.3"
bytes = "1"
bytesize = "2.4"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
# Lance's feature set (no parquet or compression): adding operon-query does
# not rebuild DataFusion for the workspace.
datafusion = { version = "54.1", default-features = false, features = [
    "crypto_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "nested_expressions",
    "regex_expressions",
    "sql",
    "string_expressions",
    "unicode_expressions",
] }
fail = "0.5"
fnv = "1"
foyer = "0.22"
futures = "0.3"
hex = "0.4"
http = "1"
http-body = "1"
humantime = "2"
indexmap = { version = "2", features = ["serde"] }
itertools = "0.14"
kafka-protocol = { version = "0.18", default-features = false }
lance = { version = "=12.0.0", default-features = false }
lance-file = { version = "=12.0.0", default-features = false }
lance-index = { version = "=12.0.0", default-features = false }
lance-io = { version = "=12.0.0", default-features = false }
lance-linalg = { version = "=12.0.0", default-features = false }
lance-table = { version = "=12.0.0", default-features = false }
moka = { version = "0.12", features = ["future"] }
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "fs"] }
once_cell = "1"
openraft = { version = "=0.10.0-alpha.34", default-features = false, features = ["serde", "tokio-rt"] }
# Bulk import (D1 Task 8): Parquet over object_store, on the workspace's arrow 58.
parquet = { version = "58", default-features = false, features = ["arrow", "async", "object_store", "snap", "zstd", "lz4"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
proptest = "1"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
qdrant-edge = "=0.8.0"
rand = "0.9"
rand_chacha = "0.9"
redb = "4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Resonate, embedded by operon-durable (D1, D140): the fork dina-kar/resonate,
# branch loam/0.10.1 = upstream 28dfd01 + PR 0c (#1164), the gcp-idtoken
# feature, PR 0a (#1162), PR 1 (#1163) and the SDK's reqwest defaults as a
# feature. Pinned by rev only; a bump compares each 0001_initial.sql with the
# pinned one and says in its PR when existing durable stores must be dropped
# (D1 plan X11). Never add resonate-server-scylladb or the NATS packages
# (BUSL-1.1 lineage).
resonate-base = { git = "https://github.com/dina-kar/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
resonate-core = { git = "https://github.com/dina-kar/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
resonate-gateway-http = { git = "https://github.com/dina-kar/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
resonate-plugin = { git = "https://github.com/dina-kar/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
# The package is resonate-sdk (lib resonate_sdk); `resonate` in that repository
# is the server binary. Its reqwest defaults (TLS, charset, system proxy) are
# off: Loam talks to the server in process.
resonate-sdk = { git = "https://github.com/dina-kar/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a", default-features = false }
resonate-server-mysql = { git = "https://github.com/dina-kar/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
resonate-server-sqlite = { git = "https://github.com/dina-kar/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
resonate-transport-http-poll = { git = "https://github.com/dina-kar/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a" }
# Without gcp-idtoken: no google-cloud-auth, and auth.mode = "gcp" is refused.
resonate-transport-http-push = { git = "https://github.com/dina-kar/resonate", rev = "e3606698e6e3f2502bb018bba1e618deb63f907a", default-features = false }
rmcp = { version = "3.4.1", features = ["server", "transport-streamable-http-server"] }
roaring = "0.11"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: qdrant-edge needs it, and Cargo unifies features, so the
# whole workspace uses one insertion-ordered map type (M1.3 row E58).
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
serde_json_borrow = "0.9"
serde_with = "3"
sha2 = "0.11"
slatedb = { version = "0.16", default-features = false }
tantivy = { version = "=0.26.2", default-features = false, features = ["quickwit", "mmap", "stopwords", "stemmer", "lz4-compression", "zstd-compression", "columnar-zstd-compression"] }
tantivy-fst = "0.5"
tempfile = "3"
thiserror = "2"
# A git pin, not crates.io 0.4.0: 0.4.0 fails cargo-deny's advisories through
# tonic 0.10 and reports lost async-commit and 1PC acknowledgements as plain
# errors (R1 plan row R4). Default features pull in openssl, procfs and
# protobuf 2 through prometheus. The pin moves only by a PR that reruns the
# operon-tikv and operon-meta-tikv suites.
tikv-client = { git = "https://github.com/tikv/client-rust", rev = "ab4be1c2cdd58d4e593202991fb520221c83bdfd", default-features = false }
time = { version = "0.3", features = ["std", "formatting", "parsing", "macros"] }
time-fmt = "0.3.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
unicode-segmentation = "1.13"
url = "2"
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"
operon-cache = { path = "crates/operon-cache", version = "0.0.1" }
operon-collection = { path = "crates/operon-collection", version = "0.0.1" }
operon-common = { path = "crates/operon-common", version = "0.0.1" }
operon-durable = { path = "crates/operon-durable", version = "0.0.1" }
operon-es = { path = "crates/operon-es", version = "0.0.1" }
operon-hnsw = { path = "crates/operon-hnsw", version = "0.0.1" }
operon-hot = { path = "crates/operon-hot", version = "0.0.1" }
operon-link = { path = "crates/operon-link", version = "0.0.1" }
operon-log = { path = "crates/operon-log", version = "0.0.1" }
operon-meta = { path = "crates/operon-meta", version = "0.0.1" }
operon-meta-conformance = { path = "crates/operon-meta-conformance", version = "0.0.1" }
operon-meta-tikv = { path = "crates/operon-meta-tikv", version = "0.0.1" }
operon-pk = { path = "crates/operon-pk", version = "0.0.1" }
operon-qdrant = { path = "crates/operon-qdrant", version = "0.0.1" }
operon-query = { path = "crates/operon-query", version = "0.0.1" }
operon-quickwit = { path = "crates/operon-quickwit", version = "0.0.1" }
operon-store = { path = "crates/operon-store", version = "0.0.1" }
operon-text = { path = "crates/operon-text", version = "0.0.1" }
operon-tikv = { path = "crates/operon-tikv", version = "0.0.1" }
operon-worker = { path = "crates/operon-worker", version = "0.0.1" }

[profile.dev]
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
