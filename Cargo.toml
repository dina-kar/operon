[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["The Operon Authors"]

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
foyer = "0.22"
futures = "0.3"
kafka-protocol = { version = "0.18", default-features = false }
moka = { version = "0.12", features = ["future"] }
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "fs"] }
openraft = { version = "=0.10.0-alpha.34", default-features = false, features = ["serde", "tokio-rt"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
proptest = "1"
redb = "4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
url = "2"
operon-cache = { path = "crates/operon-cache", version = "0.0.1" }
operon-common = { path = "crates/operon-common", version = "0.0.1" }
operon-log = { path = "crates/operon-log", version = "0.0.1" }
operon-meta = { path = "crates/operon-meta", version = "0.0.1" }
operon-store = { path = "crates/operon-store", version = "0.0.1" }
operon-worker = { path = "crates/operon-worker", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
