.kl{fill:#bc4c00}
.band.s{fill:#fbf2dc;stroke:#7d4e00}
.chip.s,.box.s{fill:#fffcf3;stroke:#7d4e00}
.sl{fill:#7d4e00}
@media (prefers-color-scheme:dark){
.t{fill:#e6edf3}
.panel{fill:#0d1117;stroke:#3d444d}
.sub,.note,.body,.badge{fill:#9198a1}
.arrow{stroke:#9198a1}
.ah{fill:#9198a1}
.chip.lg{fill:#0d1117;stroke:#e6edf3}
.band.c{fill:#0c2d4f;stroke:#4493f8}
.chip.c,.box.c{fill:#0d1f33;stroke:#4493f8}
.cl{fill:#4493f8}
.band.g{fill:#2a1b45;stroke:#ab7df8}
.chip.g,.box.g{fill:#1d1530;stroke:#ab7df8}
.gl{fill:#ab7df8}
.band.e{fill:#0f2e1a;stroke:#3fb950}
.chip.e,.box.e{fill:#0c1f13;stroke:#3fb950}
.el{fill:#3fb950}
.band.k{fill:#3a2010;stroke:#f0883e}
.chip.k,.box.k{fill:#27170c;stroke:#f0883e}
