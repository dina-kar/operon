<text class="t body" x="773.0" y="356">embedded Resonate server</text>
<text class="t body" x="773.0" y="375">durable promises and tasks</text>
<text class="t body" x="773.0" y="394">crash-safe agent runs</text>
<rect class="box e plan" x="506" y="419.0" width="241.0" height="97.0" rx="10"/>
<text class="t ttl" x="520" y="443.0">Runtime and jobs</text>
<text class="t badge" x="659" y="443.0">planned</text>
<text class="t body" x="520" y="465.0">CPU-time functions: workerd,</text>
<text class="t body" x="520" y="484.0">wasmtime, gVisor, Dapr API</text>
<text class="t body" x="520" y="503.0">jobs: Celery · BullMQ · Spark · Flink</text>
<rect class="box e plan" x="759.0" y="419.0" width="241.0" height="97.0" rx="10"/>
<text class="t ttl" x="773.0" y="443.0">Loam Postgres</text>
<text class="t badge" x="891" y="443.0">planned</text>
<text class="t body" x="773.0" y="465.0">Neon fork on Loam's WAL</text>
<text class="t body" x="773.0" y="484.0">branching, scale to zero</text>
<text class="t body" x="773.0" y="503.0">on the same bucket</text>
