<rect class="band c" x="20" y="20" width="1000" height="118" rx="12"/>
<text class="t lbl cl" x="40" y="46">CLIENTS AND PROTOCOLS</text>
<text class="t sub" x="219" y="46">your apps, agents and tools</text>
<rect class="chip c" x="40.0" y="62" width="142.6" height="30" rx="7"/>
<text class="t chipt" x="111.3" y="82" text-anchor="middle">Native REST + gRPC</text>
