<text class="t chipt" x="158.0" y="427" text-anchor="middle">collections: Lance + Tantivy</text>
<rect class="chip e" x="270.0" y="407" width="208.0" height="30" rx="7"/>
<text class="t chipt" x="374.0" y="427" text-anchor="middle">DataFusion hybrid query + SQL</text>
<rect class="chip e" x="54.0" y="444" width="208.0" height="30" rx="7"/>
<text class="t chipt" x="158.0" y="464" text-anchor="middle">hot tier: HNSW · pinned splits</text>
<rect class="chip e" x="270.0" y="444" width="208.0" height="30" rx="7"/>
<text class="t chipt" x="374.0" y="464" text-anchor="middle">workers: index · compact · GC</text>
