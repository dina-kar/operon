<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 802" width="1040" height="802" role="img" aria-labelledby="title desc">
<title id="title">Loam architecture</title>
<desc id="desc">Clients and protocols reach a stateless gateway and router, which serves the retrieval engine, Loam Live, Loam Durable, the runtime and jobs, and Loam Postgres. TiKV holds metadata, transactions and the hot WAL. Object storage (RustFS, S3, GCS or Azure Blob) holds all data in open formats. Dotted outlines are in progress; dashed outlines are planned.</desc>
<style>

