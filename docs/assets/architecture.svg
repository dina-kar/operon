<text class="t chipt" x="97.6" y="118" text-anchor="middle">Resonate SDKs</text>
<rect class="chip c prog" x="163.1" y="98" width="113.7" height="30" rx="7"/>
<text class="t chipt" x="220.0" y="118" text-anchor="middle">Loam Live SDK</text>
