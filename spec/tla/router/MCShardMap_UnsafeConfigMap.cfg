\* The ConfigMap may be written before the losing shards are fenced and the
\* gaining shards caught up. TLC must find a violation of SingleWriter.
CONSTANTS
    Keys <- SmallKeys
    Shards <- SmallShards
    Instances <- SmallInstances
    MaxGen = 2
    MaxWrites = 3
    UnsafeConfigMapFirst = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    SingleWriter
    NoStrayWrite
    ConfigMapSafe
