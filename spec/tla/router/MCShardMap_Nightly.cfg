\* Nightly bounds: two keys, three shards, three instances, three generations, four writes.
\* (Three keys with three instances passed 37 million distinct states without finishing.)
CONSTANTS
    Keys <- SmallKeys
    Shards <- SmallShards
    Instances <- NightlyInstances
    MaxGen = 3
    MaxWrites = 4
    UnsafeConfigMapFirst = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneOwner
    SingleWriter
    NoStrayWrite
    NoLostAck
    ConfigMapSafe
