\* Nightly bounds: three keys, three shards, three instances, three generations, four writes.
CONSTANTS
    Keys <- NightlyKeys
    Shards <- SmallShards
    Instances <- NightlyInstances
    MaxGen = 3
    MaxWrites = 4
    UnsafeConfigMapFirst = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneOwner
    SingleWriter
    NoStrayWrite
    NoLostAck
    ConfigMapSafe
