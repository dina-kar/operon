# cargo-deny policy. See CONTRIBUTING.md "Dependency licenses".
[graph]
all-features = true

[licenses]
# Permissive licenses only. AGPL/GPL/LGPL/BUSL-1.1/SSPL/ELv2 and proprietary licenses are not allowed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # Boost Software License 1.0 (xxhash-rust), not the Business Source License
    "BSL-1.0",
    # libbz2-rs-sys, via datafusion-datasource
    "bzip2-1.0.6",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Only fail on unmaintained crates we depend on directly; transitive ones are tracked upstream.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
