// The Loam Live sync API (design §20 §7, D121).
//
// A server stream (`Watch`) plus unary calls, never bidi: browsers cannot
// stream full duplex over fetch, and connect-rust sends no response on
// HTTP/1.1 until the request body ends. So one design works on HTTP/1.1 and
// HTTP/2, over Connect, gRPC and gRPC-Web.
//
// R1 has no authentication (D111): the server binds loopback only.
syntax = "proto3";

package loam.live.v1;

import "loam/live/v1/value.proto";

service LiveService {
  // Opens a session. The first Transition starts from the zero version and
  // carries every query's result; later ones carry only changed queries.
  // Heartbeats are empty Transitions every 15 s.
  //
  // buf lint: the response is `Transition`, not `WatchResponse`, because it
  // is the protocol's unit (§20 §7.1); RPC_RESPONSE_STANDARD_NAME is
  // excepted for this file in buf.yaml.
  rpc Watch(WatchRequest) returns (stream Transition);
  // Adds and removes queries in an open session. The next Transition
  // reflects the change.
  rpc ModifyQuerySet(ModifyQuerySetRequest) returns (ModifyQuerySetResponse);
  // A one-shot query, at the latest tick or at a given timestamp.
  rpc Query(QueryRequest) returns (QueryResponse);
  // Runs a mutation; returns its commit timestamp and result.
  rpc Mutate(MutateRequest) returns (MutateResponse);
  // Admin: deploys a function bundle and a schema.
  rpc Deploy(DeployRequest) returns (DeployResponse);
}

// A session's state: (query-set version, identity version, ts). A client
// applies a Transition only if its `start` equals the client's current
// version; a gap means it resumes. The zero version is {0, 0, 0}.
message StateVersion {
  uint64 query_set = 1;
  uint64 identity = 2;
  // The TSO timestamp every query of the session was evaluated at.
  uint64 ts = 3;
}

message WatchRequest {
  oneof start {
    // A new session with this query set.
    QuerySet initial = 1;
    // A reconnect: rerun the set at a tick at or after `last_version.ts`
    // and send full results.
    Resume resume = 2;
  }
}

message Resume {
  StateVersion last_version = 1;
  QuerySet query_set = 2;
}

message QuerySet {
  uint64 version = 1;
  repeated QuerySpec queries = 2;
}

message QuerySpec {
  // Chosen by the client, unique within its session.
  uint32 query_id = 1;
  // "module:export", or a built-in such as "_system:query".
  string function = 2;
  Value args = 3;
}

message ModifyQuerySetRequest {
  string session_id = 1;
  // Must equal the session's current query-set version, else
  // FailedPrecondition.
  uint64 base_version = 2;
  uint64 new_version = 3;
  repeated QuerySetChange changes = 4;
}

message QuerySetChange {
  oneof change {
    QuerySpec add = 1;
    // The query id to remove.
    uint32 remove = 2;
  }
}

message ModifyQuerySetResponse {}

// One step of a session, from `start` to `end`.
message Transition {
  string session_id = 1;
  // Must equal the client's current version.
  StateVersion start = 2;
  StateVersion end = 3;
  // Per query id: a value, an error, or removed.
  repeated QueryUpdate updates = 4;
  // Chunked: more Transition messages with the same `end` follow, and the
  // client applies them together.
  bool more = 5;
}

message QueryUpdate {
  uint32 query_id = 1;
  oneof update {
    Value value = 2;
    LiveError error = 3;
    Removed removed = 4;
  }
}

// The query left the query set.
message Removed {}

message QueryRequest {
  string function = 1;
  Value args = 2;
  // A TSO timestamp to read at; the latest tick when unset.
  optional uint64 ts = 3;
}

message QueryResponse {
  // The timestamp the query was evaluated at.
  uint64 ts = 1;
  Value result = 2;
}

message MutateRequest {
  string function = 1;
  Value args = 2;
  // A retried call with the same key returns the recorded commit timestamp
  // and result instead of running again (§20 §5.1).
  optional string idempotency_key = 3;
}

message MutateResponse {
  uint64 commit_ts = 1;
  Value result = 2;
}

message DeployRequest {
  // One ES module (§20 §6).
  bytes bundle = 1;
  Schema schema = 2;
}

message DeployResponse {
  string deployment_id = 1;
}

// A deployed schema: tables and their indexes (validators arrive in R2).
message Schema {
  repeated TableSchema tables = 1;
}

message TableSchema {
  string name = 1;
  // User indexes; `by_id` and `by_creation_time` are implicit.
  repeated IndexSchema indexes = 2;
}

message IndexSchema {
  string name = 1;
  // Up to 16 field names; `_creationTime` and `_id` are appended.
  repeated string fields = 2;
}

// An error for one query in a Transition. Call errors use the Connect error
// codes; this carries the same meaning inside a stream that stays open.
message LiveError {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The arguments or a value are invalid, or a limit was exceeded.
  ERROR_CODE_INVALID_ARGUMENT = 1;
  // The function, table or document does not exist.
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_FAILED_PRECONDITION = 3;
  ERROR_CODE_RESOURCE_EXHAUSTED = 4;
  // The function threw.
  ERROR_CODE_FUNCTION_ERROR = 5;
  // The function ran past its CPU limit.
  ERROR_CODE_FUNCTION_TIMEOUT = 6;
  // The function ran past its memory limit.
  ERROR_CODE_FUNCTION_OUT_OF_MEMORY = 7;
  ERROR_CODE_UNAVAILABLE = 8;
  ERROR_CODE_INTERNAL = 9;
}
