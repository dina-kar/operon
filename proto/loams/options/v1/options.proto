// Options that drive the SDK facade (design §44 §7.3, D606).
//
// Every public `loams.<service>.v1` service names the SDK module it belongs
// to (`loams.vector`, `loams.collections`, ...), and a method may name the
// facade call(s) it backs. `protoc-gen-loams-facade` (SDK1) reads these
// options from the descriptors and renders one facade per language, so the
// thirteen SDKs cannot drift. The server ignores them.
syntax = "proto3";

package loams.options.v1;

import "google/protobuf/descriptor.proto";

// The SDK module a service belongs to.
message ModuleOptions {
  // The module's name in `snake_case`, for example "vector" or "admin.org".
  string name = 1;
  // One line for the module's reference docs.
  string summary = 2;
  // True for a package whose wire contract may still change: `buf breaking`
  // skips it and SDKs mark the module experimental (today `loams.live`).
  bool unstable = 3;
}

// One facade call backed by a method. A method may back several calls, for
// example `QueryService/Search` is both `loams.vector.search` and
// `loams.search.query` (§44 §7.3).
message FacadeOptions {
  // The module the call is exposed in; empty means the service's module.
  string module = 1;
  // The call's name in `snake_case`; empty means the method name.
  string name = 2;
  // Overrides the retry class the facade derives from `idempotency_level`
  // and `idempotency_key` (D610): true lets the SDK retry the call.
  bool retry_safe = 3;
  // AIP-158 pagination as "<items field>:<next page token field>", for
  // example "collections:next_page_token"; the facade adds a `list_all`
  // iterator for it.
  string pagination = 4;
}

extend google.protobuf.ServiceOptions {
  // Extension numbers 50001-50099 are this package's (the range
  // 50000-99999 is for an organisation's own options).
  ModuleOptions module = 50001;
}

extend google.protobuf.MethodOptions {
  repeated FacadeOptions facade = 50002;
}
