# The loams.live.v1 protos (R1 plan Task 7) and the app protos (design §37
# §8, AP0). `buf lint` runs the STANDARD rules. `buf breaking` is enforced
# for the app packages (CI job `app-protos`); loams.live.v1 is ignored, as
# breaking changes are not enforced in R1 (the API is unstable).
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  ignore_only:
    # Watch streams `Transition`, the protocol's unit (design §20 §7.1),
    # rather than a `WatchResponse` wrapper (plan row T7-4).
    RPC_RESPONSE_STANDARD_NAME:
      - proto/loams/live/v1/live.proto
breaking:
  use:
    - FILE
  ignore:
    - proto/loams/live
