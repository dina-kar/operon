# TypeScript for @loams/live (R1 plan Task 7): protoc-gen-es writes the
# messages and the LiveService descriptor that @connectrpc/connect v2 uses.
# Run `pnpm run generate` in sdks/live-typescript (it pins buf and the
# plugin); CI regenerates and fails on a diff. journal.proto, catalog.proto
# and idempotency.proto are internal to the server and not generated.
# Only loams.live.v1 is generated here; the app packages (§37 §8.4) have
# their own template, buf.gen.apps.yaml, which writes @loams/proto.
version: v2
inputs:
  - directory: proto
    paths:
      - proto/loams/live/v1
    exclude_paths:
      - proto/loams/live/v1/journal.proto
      - proto/loams/live/v1/catalog.proto
      - proto/loams/live/v1/idempotency.proto
plugins:
  - local: sdks/live-typescript/node_modules/.bin/protoc-gen-es
    out: sdks/live-typescript/src/gen
    include_imports: false
    opt:
      - target=ts
      - import_extension=js
clean: true
