name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: the long simulation sweep (M0.4 plan Task 6).
    - cron: "17 2 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: metastore boundary
        run: |
          for c in operon-worker operon-log operon-link operon-collection; do
            if cargo tree -p "$c" -e normal --prefix none --locked | grep -q '^operon-meta v'; then
              echo "$c depends on operon-meta outside dev-dependencies (D47)"; exit 1
            fi
          done
          deps=$(cargo tree -p operon-common -e normal --depth 1 --prefix none --locked | tail -n +2 | awk '{print $1}' | sort -u | tr '\n' ' ')
          test "$deps" = "async-trait serde thiserror tracing " || { echo "operon-common dependencies changed: $deps"; exit 1; }
          if grep -rnwE 'MetaClient|MetaNode|MetaState|PartitionState' crates/operon-worker/src crates/operon-log/src crates/operon-link/src crates/operon-collection/src crates/operon/src/api.rs; then
            echo "downstream source names an openraft type (D47)"; exit 1
          fi
      - name: test
        run: cargo test --workspace --locked
      - name: metastore encoding
        run: cargo test -p operon-meta --test it encoding:: --locked
      - name: metastore conformance
        run: cargo test -p operon-meta --test it conformance:: --locked
      - name: log with failpoints
        run: cargo test -p operon-log --features failpoints --locked
      - name: link with failpoints
        run: cargo test -p operon-link --features failpoints --locked
      - name: collection with failpoints
        run: cargo test -p operon-collection --features failpoints --locked

  crash-gate:
    name: kill -9 crash gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: clippy with failpoints
        run: cargo clippy -p operon --all-targets --features failpoints --locked -- -D warnings
      - name: crash gate
        run: cargo test -p operon --features failpoints --test crash --locked

  sim:
    name: simulation seed sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: simulation (32 seeds x 300 steps)
        if: github.event_name != 'schedule'
        run: cargo test -p operon-sim --release --locked
      - name: simulation (1000 seeds x 300 steps, nightly)
        if: github.event_name == 'schedule'
        run: cargo test -p operon-sim --release --locked --test it sim::
        env:
          SIM_SEEDS: "1000"

  deny:
    name: licenses, advisories, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
