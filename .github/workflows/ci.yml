name: CI

# Docs-only changes run no CI at all. The nightly schedule is unfiltered.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "deploy/**/*.md"
      - ".superpowers/**"
      - "LICENSE*"
      - ".coderabbit*"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "deploy/**/*.md"
      - ".superpowers/**"
      - "LICENSE*"
      - ".coderabbit*"
  schedule:
    # Nightly: the long simulation sweep (M0.4 plan Task 6), the tail-merge
    # property test (M1.2 plan Task 15), the TiKV suites (R1 plan Task 1) and
    # the durable store on TiDB (D1 plan Task 5).
    - cron: "17 2 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which parts of the tree a pull request touches. The jobs below run on a
  # pull request only when their filter matches; on a push to main and on the
  # nightly schedule every job runs as before (this job is skipped there).
  # dorny/paths-filter is MIT-licensed; pinned to v4.0.3.
  changes:
    name: changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      engine: ${{ steps.filter.outputs.engine }}
      es: ${{ steps.filter.outputs.es }}
      sim: ${{ steps.filter.outputs.sim }}
      tikv: ${{ steps.filter.outputs.tikv }}
      durable: ${{ steps.filter.outputs.durable }}
      deny: ${{ steps.filter.outputs.deny }}
      protos: ${{ steps.filter.outputs.protos }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Every Rust filter includes these.
            toolchain: &toolchain
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain*"
              - ".cargo/**"
              - ".github/workflows/**"
            # Any Rust change: fmt, clippy, the workspace tests.
            # operon-console-mock embeds api/console/openapi.json.
            rust:
              - *toolchain
              - "crates/**"
              - "proto/**"
              - "api/**"
              - "clippy.toml"
              - "rustfmt.toml"
            # The crates in operon's default build (no tikv, no durable):
            # the crash gate, the cluster tests and the client suites.
            # A new crate the binary depends on must be added here.
            engine: &engine
              - *toolchain
              - "crates/operon/**"
              - "crates/operon-cache/**"
              - "crates/operon-collection/**"
              - "crates/operon-common/**"
              - "crates/operon-es/**"
              - "crates/operon-hnsw/**"
              - "crates/operon-hot/**"
              - "crates/operon-link/**"
              - "crates/operon-log/**"
              - "crates/operon-meta/**"
              - "crates/operon-meta-conformance/**"
              - "crates/operon-pk/**"
              - "crates/operon-qdrant/**"
              - "crates/operon-query/**"
              - "crates/operon-quickwit/**"
              - "crates/operon-store/**"
              - "crates/operon-text/**"
              - "crates/operon-worker/**"
            es:
              - *engine
              - "conformance/es-client/**"
            # operon-sim and the crates it depends on.
            sim:
              - *toolchain
              - "crates/operon-sim/**"
              - "crates/operon-cache/**"
              - "crates/operon-collection/**"
              - "crates/operon-common/**"
              - "crates/operon-link/**"
              - "crates/operon-log/**"
              - "crates/operon-meta/**"
              - "crates/operon-meta-conformance/**"
              - "crates/operon-pk/**"
              - "crates/operon-query/**"
              - "crates/operon-quickwit/**"
              - "crates/operon-store/**"
              - "crates/operon-text/**"
              - "crates/operon-worker/**"
            tikv:
              - *toolchain
              - "crates/operon-tikv/**"
              - "crates/operon-meta-tikv/**"
              - "crates/operon-meta/**"
              - "crates/operon-meta-conformance/**"
              - "crates/operon-common/**"
              - "crates/operon-live*/**"
              - "crates/operon-durable/**"
              - "crates/operon-safekeeper/**"
              - "crates/operon/Cargo.toml"
              - "crates/operon/src/server.rs"
              - "crates/operon/src/meta_backend.rs"
              - "crates/operon/src/main.rs"
              - "crates/operon/tests/meta_tikv.rs"
              - "deploy/tikv/**"
              - "scripts/tikv/**"
              - "proto/loam/**"
            durable:
              - *toolchain
              - "crates/operon-durable/**"
              - "crates/operon/src/api/operations.rs"
              - "crates/operon/src/api/import.rs"
              - "crates/operon/src/main.rs"
              - "crates/operon/src/server.rs"
              - "crates/operon/Cargo.toml"
              - "crates/operon/tests/durable.rs"
              - "scripts/durable/**"
            deny:
              - *toolchain
              - "crates/*/Cargo.toml"
              - "deny.toml"
            protos:
              - ".github/workflows/**"
              - "proto/**"
              - "buf.yaml"
              - "buf.gen.yaml"
              - "sdks/live-typescript/**"
            web:
              - ".github/workflows/**"
              - "web/**"
              - "api/**"

  check:
    name: fmt, clippy, test
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Owner ruling T7-3: the TiKV metastore is behind operon's `tikv`
      # feature (off by default), so lint that code too, and keep the default
      # build free of the git-pinned tikv-client.
      - name: clippy (operon with the tikv feature)
        run: cargo clippy -p operon --all-targets --features tikv,durable-tikv --locked -- -D warnings
      - name: clippy (operon-durable with the native TiKV store)
        run: cargo clippy -p operon-durable --all-targets --features tikv --locked -- -D warnings
      - name: operon's default build has no tikv-client
        run: |
          if cargo tree -p operon -e normal --prefix none --locked | grep -q '^tikv-client v'; then
            echo "operon's default features depend on tikv-client (owner ruling T7-3)"; exit 1
          fi
      # The gateway's module doc holds its divergences from Qdrant (M1.4
      # Task 11); its links must resolve.
      - name: qdrant gateway docs
        run: cargo doc -p operon-qdrant --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: metastore boundary
        run: |
          for c in operon-worker operon-log operon-link operon-collection operon-query operon-hnsw operon-hot; do
            if cargo tree -p "$c" -e normal --prefix none --locked | grep -q '^operon-meta v'; then
              echo "$c depends on operon-meta outside dev-dependencies (D47)"; exit 1
            fi
          done
          deps=$(cargo tree -p operon-common -e normal --depth 1 --prefix none --locked | tail -n +2 | awk '{print $1}' | sort -u | tr '\n' ' ')
          test "$deps" = "async-trait serde thiserror tracing " || { echo "operon-common dependencies changed: $deps"; exit 1; }
          # A missing path must fail the step: grep exits 2 for it, which an
          # `if` would read as "no match" (row 0.87).
          paths="crates/operon-worker/src crates/operon-log/src crates/operon-link/src crates/operon-collection/src crates/operon-query/src crates/operon-hnsw/src crates/operon-hot/src crates/operon/src/api"
          for p in $paths; do
            test -e "$p" || { echo "metastore boundary path $p does not exist"; exit 1; }
          done
          status=0
          grep -rnwE 'MetaClient|MetaNode|MetaState|PartitionState' $paths || status=$?
          case $status in
            0) echo "downstream source names an openraft type (D47)"; exit 1 ;;
            1) ;;
            *) echo "the boundary grep failed ($status)"; exit 1 ;;
          esac
      - name: test
        run: cargo test --workspace --locked
      - name: metastore encoding
        run: 'cargo test -p operon-meta --test it encoding:: --locked'
      - name: metastore conformance
        run: 'cargo test -p operon-meta --test it conformance:: --locked'
      - name: log with failpoints
        run: cargo test -p operon-log --features failpoints --locked
      - name: link with failpoints
        run: cargo test -p operon-link --features failpoints --locked
      - name: collection with failpoints
        run: cargo test -p operon-collection --features failpoints --locked

  crash-gate:
    name: kill -9 crash gate
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.engine == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: clippy with failpoints
        run: cargo clippy -p operon --all-targets --features failpoints --locked -- -D warnings
      - name: crash gate
        run: cargo test -p operon --features failpoints --test crash --locked

  cluster:
    name: multi-process cluster
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.engine == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build -p operon --locked
      - name: clippy with cluster tests
        run: cargo clippy -p operon --all-targets --features cluster-tests --locked -- -D warnings
      # Each test starts five or six `operon` processes: one at a time.
      - name: cluster tests
        run: cargo test -p operon --features cluster-tests --test cluster --locked -- --test-threads=1

  qdrant-client:
    name: Python qdrant-client smoke
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.engine == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build -p operon --locked
      - name: start operon dev
        run: |
          nohup target/debug/operon dev --data-dir "$RUNNER_TEMP/operon" \
            --qdrant-listen 127.0.0.1:6333 --qdrant-grpc-listen 127.0.0.1:6334 --no-es \
            > "$RUNNER_TEMP/operon.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:6333/ && exit 0
            sleep 1
          done
          echo "operon dev did not answer on 6333 within 60 s"; exit 1
      - uses: astral-sh/setup-uv@v6
      # Each run prints `qdrant-client <version> <mode>: <n> checks passed`
      # last; the step fails unless it does.
      - name: qdrant-client 1.15.1 (legacy)
        run: |
          crates/operon-qdrant/tests/python/run.sh 1.15.1 legacy | tee "$RUNNER_TEMP/legacy.log"
          grep -q '^qdrant-client 1.15.1 legacy: [0-9]* checks passed$' "$RUNNER_TEMP/legacy.log"
      - name: qdrant-client 1.19.1 (modern)
        run: |
          crates/operon-qdrant/tests/python/run.sh 1.19.1 modern | tee "$RUNNER_TEMP/modern.log"
          grep -q '^qdrant-client 1.19.1 modern: [0-9]* checks passed$' "$RUNNER_TEMP/modern.log"
      - name: operon log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/operon.log" || true

  es-client:
    name: Elasticsearch client suite
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.es == 'true') }}
    runs-on: ubuntu-latest
    # The Elasticsearch 8.19 oracle (plan M1.5 Task 11, owner ruling
    # O-M15-6): a CI-only test oracle, never vendored or shipped (R14).
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.license.self_generated.type: trial
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9250:9200
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:9200/_cluster/health"
          --health-interval 5s --health-timeout 5s --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build -p operon --locked
      - uses: astral-sh/setup-uv@v6
      # The suite starts `operon dev` on ephemeral ports (conftest.py) and
      # runs the oracle checks against the service above.
      - name: elasticsearch-py 8.19.3 against operon dev
        env:
          OPERON_BIN: target/debug/operon
          ES_ORACLE_URL: http://127.0.0.1:9250
        run: conformance/es-client/run.sh

  sim:
    name: simulation seed sweep
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.sim == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: simulation (32 seeds x 300 steps)
        if: github.event_name != 'schedule'
        run: cargo test -p operon-sim --release --locked
      - name: simulation (1000 seeds x 300 steps, nightly)
        if: github.event_name == 'schedule'
        run: 'cargo test -p operon-sim --release --locked --test it sim::'
        env:
          SIM_SEEDS: "1000"
      - name: tail merge against a full rebuild (256 cases, nightly)
        if: github.event_name == 'schedule'
        run: 'cargo test -p operon-query --release --locked --test it tail_vs_rebuild::'
        env:
          TAIL_PROP_CASES: "256"

  # R1 plan Task 1: the TiKV-backed suites against a tiup playground (PD and
  # TiKV v8.5.8 on API v2, port offset 17000). Pull requests run it only when
  # they touch the TiKV crates, their cluster config or scripts, or the Live
  # protos (the `tikv` filter in the changes job).
  tikv:
    name: TiKV suites
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.changes.outputs.tikv == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: packages
        id: packages
        # The TiKV crates that exist so far (later R1 tasks add the rest).
        run: |
          args=
          for c in operon-tikv operon-meta-tikv operon-live operon-live-js; do
            if [ -d "crates/$c" ]; then args="$args -p $c"; fi
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: build the suites
        run: |
          cargo test ${{ steps.packages.outputs.args }} --locked --no-run
          cargo test -p operon --features tikv --test meta_tikv --locked --no-run
          cargo test -p operon-durable --features tikv --lib --test tikv --locked --no-run
          cargo test -p operon-safekeeper --features tikv --test tikv --locked --no-run
      - uses: actions/cache@v4
        with:
          path: ~/.tiup/components
          key: tiup-components-v8.5.8-${{ runner.os }}
      - name: install tiup and the v8.5.8 components
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh
          echo "$HOME/.tiup/bin" >> "$GITHUB_PATH"
          "$HOME/.tiup/bin/tiup" install playground pd:v8.5.8 tikv:v8.5.8
      - name: start the playground
        run: scripts/tikv/playground.sh start --tag loam-ci --timeout 120
      - name: TiKV suites
        env:
          OPERON_TEST_PD: 127.0.0.1:19379
        run: |
          cargo test ${{ steps.packages.outputs.args }} --locked
          cargo test -p operon --features tikv --test meta_tikv --locked
          cargo test -p operon-durable --features tikv --lib --test tikv --locked
          cargo test -p operon-safekeeper --features tikv --test tikv --locked
      - name: playground logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tikv-playground-logs-${{ github.job }}
          path: |
            target/tikv-playground/*.log
            ~/.tiup/data/loam-ci/**/*.log
          if-no-files-found: ignore
      - name: stop the playground
        if: always()
        run: scripts/tikv/playground.sh stop --tag loam-ci

  # The same suites every night, plus the nightly-only TiKV suites later R1
  # tasks add.
  tikv-nightly:
    name: TiKV suites (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: paths
        id: paths
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - name: protoc
        if: steps.paths.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        if: steps.paths.outputs.run == 'true'
      - name: packages
        id: packages
        if: steps.paths.outputs.run == 'true'
        # The TiKV crates that exist so far (later R1 tasks add the rest).
        run: |
          args=
          for c in operon-tikv operon-meta-tikv operon-live operon-live-js; do
            if [ -d "crates/$c" ]; then args="$args -p $c"; fi
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: build the suites
        if: steps.paths.outputs.run == 'true'
        run: |
          cargo test ${{ steps.packages.outputs.args }} --locked --no-run
          cargo test -p operon --features tikv --test meta_tikv --locked --no-run
          cargo test -p operon --features failpoints,tikv --test crash --locked --no-run
      - uses: actions/cache@v4
        if: steps.paths.outputs.run == 'true'
        with:
          path: ~/.tiup/components
          key: tiup-components-v8.5.8-${{ runner.os }}
      - name: install tiup and the v8.5.8 components
        if: steps.paths.outputs.run == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh
          echo "$HOME/.tiup/bin" >> "$GITHUB_PATH"
          "$HOME/.tiup/bin/tiup" install playground pd:v8.5.8 tikv:v8.5.8
      - name: start the playground
        if: steps.paths.outputs.run == 'true'
        run: scripts/tikv/playground.sh start --tag loam-ci --timeout 120
      - name: TiKV suites
        if: steps.paths.outputs.run == 'true'
        env:
          OPERON_TEST_PD: 127.0.0.1:19379
          # Nightly-only cases (operon_tikv::testing::nightly), such as
          # old_versions_dropped_after_gc.
          OPERON_TEST_NIGHTLY: "1"
        run: |
          cargo test ${{ steps.packages.outputs.args }} --locked
          cargo test -p operon --features tikv --test meta_tikv --locked
      # R1 plan Task 6: the M1.1 gates on the TiKV metastore. The kill -9
      # crash gate runs `operon dev --meta tikv://…` (its snapshot rows are
      # openraft-only and skip); the object-store fault matrix and the
      # simulation stay on openraft (row T6-8).
      - name: crash gate on the TiKV metastore
        if: steps.paths.outputs.run == 'true'
        env:
          OPERON_TEST_PD: 127.0.0.1:19379
          OPERON_GATE_META: tikv://127.0.0.1:19379/loam_test_meta
        run: cargo test -p operon --features failpoints,tikv --test crash --locked
      - name: playground logs
        if: failure() && steps.paths.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tikv-playground-logs-${{ github.job }}
          path: |
            target/tikv-playground/*.log
            ~/.tiup/data/loam-ci/**/*.log
          if-no-files-found: ignore
      - name: stop the playground
        if: always() && steps.paths.outputs.run == 'true'
        run: scripts/tikv/playground.sh stop --tag loam-ci

  # D1 plan Task 5: the embedded durable server's tests and Resonate's
  # linearizability check (porcupine) against `operon dev` on SQLite. Pull
  # requests run it only when they touch the durable crate, its routes or
  # scripts, the workflows, or the workspace manifests (the `durable` filter
  # in the changes job). `durable` is an opt-in feature (O1).
  durable:
    name: durable execution (SQLite linearizability)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.changes.outputs.durable == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DURABLE_FORK_TARGET_DIR: ${{ github.workspace }}/target/durable-fork-build
    steps:
      - uses: actions/checkout@v4
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          key: durable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: operon-durable tests
        run: cargo test -p operon-durable --locked
      - name: operon durable tests
        run: cargo test -p operon --features durable --test durable --bin operon --locked
      - name: checker self-test
        run: scripts/durable/conformance.sh --self-test
      - name: linearizability on SQLite (8 clients x 600 ops)
        run: scripts/durable/conformance.sh --store sqlite --clients 8 --ops 600
      - name: conformance output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: durable-conformance-sqlite
          path: target/durable-conformance/
          if-no-files-found: ignore

  # D1 plan Task 5, nightly: the TiDB backend's suite and the linearizability
  # check against `operon dev --durable-store mysql://…` on a throwaway TiDB
  # v8.5.8 (the optimistic-mode test flips a global variable). The TiDB leg
  # drops 503 answers as not applied (porc-503.sh) until upstream PR 0b; the
  # job summary shows how many there were.
  durable-tidb:
    name: durable execution on TiDB (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DURABLE_FORK_TARGET_DIR: ${{ github.workspace }}/target/durable-fork-build
    steps:
      - uses: actions/checkout@v4
      - name: protoc and the mysql client
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mysql-client
      - uses: Swatinem/rust-cache@v2
        with:
          key: durable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      # Everything is built before TiDB starts.
      - name: build the TiDB suite and operon
        run: |
          cargo test -p operon-durable --features mysql --test tidb --locked --no-run
          cargo build --release --locked -p operon --features durable-mysql
      - uses: actions/cache@v4
        with:
          path: ~/.tiup/components
          key: tiup-components-tidb-v8.5.8-${{ runner.os }}
      - name: install tiup and the v8.5.8 components
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh
          echo "$HOME/.tiup/bin" >> "$GITHUB_PATH"
          "$HOME/.tiup/bin/tiup" install playground pd:v8.5.8 tikv:v8.5.8 tidb:v8.5.8
      - name: start TiDB
        run: |
          scripts/durable/tidb.sh up --tag loam-ci-durable --port-offset 27000 --timeout 180 | tee "$RUNNER_TEMP/tidb.out"
          sed -n 's/^export \(OPERON_TEST_TIDB=.*\)$/\1/p' "$RUNNER_TEMP/tidb.out" >> "$GITHUB_ENV"
      - name: TiDB suite
        run: cargo test -p operon-durable --features mysql --test tidb --locked
      - name: linearizability on TiDB (8 clients x 600 ops)
        run: scripts/durable/conformance.sh --store tidb --clients 8 --ops 600 --operon-bin target/release/operon
      - name: linearizability on TiDB (16 clients x 400 ops, seeds 11, 12, 13)
        run: |
          for seed in 11 12 13; do
            scripts/durable/conformance.sh --store tidb --clients 16 --ops 400 --seed "$seed" \
              --operon-bin target/release/operon
          done
      - name: conformance output and TiDB logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: durable-tidb-logs
          path: |
            target/durable-conformance/
            target/durable-tidb/*.log
            ~/.tiup/data/loam-ci-durable/**/*.log
          if-no-files-found: ignore
      - name: stop TiDB
        if: always()
        run: scripts/durable/tidb.sh down --tag loam-ci-durable

  # R1 plan Task 7: the loam.live.v1 protos pass `buf lint` (STANDARD), and
  # the checked-in TypeScript in sdks/live-typescript/src/gen is what
  # `buf generate` writes from them. buf and protoc-gen-es are pinned in
  # sdks/live-typescript/package.json. The Rust code is generated at build
  # time (operon-live-proto's build.rs), so the check job covers it.
  live-protos:
    name: loam.live.v1 protos and generated TypeScript
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.protos == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sdks/live-typescript/pnpm-lock.yaml
      - name: install
        working-directory: sdks/live-typescript
        run: pnpm install --frozen-lockfile
      - name: buf lint
        run: sdks/live-typescript/node_modules/.bin/buf lint
      - name: regenerate the TypeScript
        working-directory: sdks/live-typescript
        run: pnpm run generate
      - name: the generated code is up to date
        run: |
          git add -N sdks/live-typescript/src/gen
          git diff --exit-code -- sdks/live-typescript/src/gen || {
            echo "sdks/live-typescript/src/gen is stale: run 'pnpm run generate' in sdks/live-typescript and commit the result"; exit 1;
          }

  deny:
    name: licenses, advisories, sources
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.deny == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    name: console and @loam/ui
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: the generated API types match the contract
        run: pnpm gen:api && git diff --exit-code -- apps/console/src/api/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
