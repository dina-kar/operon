# One-replica integration topology. Production needs explicit cluster peers,
# object storage, and independently deployed Resonate workers.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: operon-stream-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operon-stream
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: operon-stream
  template:
    metadata:
      labels:
        app: operon-stream
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: operon-stream
        dapr.io/app-port: "8091"
        dapr.io/app-protocol: grpc
        dapr.io/config: operon-stream
    spec:
      serviceAccountName: operon-trigger-edge
      initContainers:
        - name: reject-dapr-workflow
          image: operon-trigger-edge:dev
          args: [--check-config]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DAPR_CONFIG_NAME
              value: operon-stream
      containers:
        - name: operon
          image: operon:tikv-stream-grpc-durable-tikv
          args:
            - dev
            - --data-dir
            - /data
            - --listen
            - 0.0.0.0:8080
            - --stream-grpc-listen
            - 127.0.0.1:8091
            - --meta
            - tikv://pd.operon.svc.cluster.local:2379/operon-meta
            - --durable-store
            - tikv://pd.operon.svc.cluster.local:2379/operon-durable
          ports:
            - name: native-http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: native-http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: operon-stream-data
