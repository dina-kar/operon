[package]
name = "loams-trigger-edge"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace]

[dependencies]
axum = "0.8"
dapr = { version = "0.19", default-features = false }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"
