apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: loams-agent-events
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: kafka.loams.svc.cluster.local:9092
    - name: consumerGroup
      value: loams-workflow-agent
    - name: authType
      value: none
    - name: initialOffset
      value: oldest
scopes:
  - loams-trigger-edge
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: loams-agent-triggers
spec:
  pubsubname: loams-agent-events
  topic: workflow.agent
  routes:
    default: /events/agent
scopes:
  - loams-trigger-edge
