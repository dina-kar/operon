apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: operon-kafka-events
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: kafka.operon.svc.cluster.local:9092
    - name: consumerGroup
      value: operon-workflow-kafka
    - name: authType
      value: none
    - name: initialOffset
      value: oldest
scopes:
  - operon-trigger-edge
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: operon-kafka-triggers
spec:
  pubsubname: operon-kafka-events
  topic: workflow.kafka
  routes:
    default: /events/kafka
scopes:
  - operon-trigger-edge
