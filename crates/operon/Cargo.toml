[package]
name = "operon"
description = "The Operon server: the native HTTP API, the Qdrant gateway and the dev, standalone and cluster commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "operon"
path = "src/main.rs"

[dependencies]
# The import's batches (D1 Task 8), with the durable feature only.
arrow-array = { workspace = true, optional = true }
# NDJSON vectors are cast to Float32 before mapping (D1 Q10).
arrow-cast = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
fail = { workspace = true, optional = true }
http.workspace = true
operon-cache.workspace = true
operon-collection.workspace = true
operon-common.workspace = true
# The embedded Resonate server (D1), with the durable feature only.
operon-durable = { workspace = true, optional = true }
operon-hnsw.workspace = true
operon-hot.workspace = true
operon-link.workspace = true
operon-log.workspace = true
operon-meta.workspace = true
operon-qdrant = { workspace = true, optional = true }
operon-query.workspace = true
operon-store.workspace = true
operon-worker.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
url.workspace = true

[features]
default = ["flight", "hnsw", "qdrant"]
# Serve Arrow Flight SQL (Task 12; `--flight-sql-listen`).
flight = []
# Serve the Qdrant REST and gRPC APIs (plan M1.4; `--qdrant-listen`).
qdrant = ["dep:operon-qdrant"]
# The qdrant-edge HNSW engine for hot artifacts (M1.3); without it the hot
# tier builds only when `ServerConfig.hnsw_engine` is set.
hnsw = ["operon-hot/hnsw"]
# Durable execution (D1, design §21): the embedded Resonate server on SQLite,
# on 127.0.0.1:8001 (--durable-*). Opt-in (owner ruling O1): toggling it
# rebuilds about 480 crates. Release builds, CI's durable jobs and the Loam
# cloud build turn it on; without it, a --durable-* flag only logs.
durable = ["dep:operon-durable", "dep:arrow-array", "dep:arrow-cast", "dep:arrow-schema"]
# The TiDB durable store through Resonate's MySQL plugin (D1 Task 4).
durable-mysql = ["durable", "operon-durable/mysql"]
# Builds the multi-process cluster tests (`tests/cluster.rs`, M1.3 Task 11;
# E43); CI runs them in their own job.
cluster-tests = []
# Named failpoints for the crash gate (M0.4 Task 5): with it, the binary
# reads OPERON_FAILPOINTS and OPERON_FAILPOINT_HIT. Off by default, so release
# builds contain no failpoints.
failpoints = [
    "dep:fail",
    "fail/failpoints",
    "operon-collection/failpoints",
    "operon-hot/failpoints",
    "operon-link/failpoints",
    "operon-log/failpoints",
    "operon-meta/failpoints",
]

[dev-dependencies]
arrow-array.workspace = true
arrow-flight.workspace = true
arrow-schema.workspace = true
futures.workspace = true
object_store.workspace = true
# The import tests write Parquet sources (D1 Task 8).
parquet.workspace = true
# The reference evaluator of the Qdrant filter tests (plan M1.4 Task 4).
operon-qdrant = { workspace = true, features = ["test-util"] }
proptest.workspace = true
prost.workspace = true
prost-types.workspace = true
tempfile.workspace = true
tonic = { workspace = true, features = ["gzip"] }

[lints]
workspace = true
