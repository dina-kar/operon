[package]
name = "operon"
description = "The Operon server: the native HTTP API and the dev and standalone commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "operon"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
fail = { workspace = true, optional = true }
http.workspace = true
operon-cache.workspace = true
operon-collection.workspace = true
operon-common.workspace = true
operon-link.workspace = true
operon-log.workspace = true
operon-meta.workspace = true
operon-query.workspace = true
operon-store.workspace = true
operon-worker.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
url.workspace = true

[features]
default = ["flight"]
# Serve Arrow Flight SQL (Task 12; `--flight-sql-listen`).
flight = []
# Named failpoints for the crash gate (M0.4 Task 5): with it, the binary
# reads OPERON_FAILPOINTS and OPERON_FAILPOINT_HIT. Off by default, so release
# builds contain no failpoints.
failpoints = [
    "dep:fail",
    "fail/failpoints",
    "operon-collection/failpoints",
    "operon-link/failpoints",
    "operon-log/failpoints",
    "operon-meta/failpoints",
]

[dev-dependencies]
arrow-array.workspace = true
arrow-flight.workspace = true
arrow-schema.workspace = true
futures.workspace = true
object_store.workspace = true
prost.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tonic.workspace = true

[lints]
workspace = true
