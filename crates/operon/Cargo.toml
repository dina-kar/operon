[package]
name = "operon"
description = "The Operon server: the native HTTP API, the Qdrant and Elasticsearch gateways and the dev, standalone and cluster commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "operon"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
datafusion = { workspace = true, optional = true }
datafusion-postgres = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
fail = { workspace = true, optional = true }
http.workspace = true
operon-cache.workspace = true
operon-collection.workspace = true
operon-common.workspace = true
# The embedded Resonate server (D1), with the durable feature only.
operon-durable = { workspace = true, optional = true }
operon-es = { workspace = true, optional = true }
operon-hnsw.workspace = true
operon-hot.workspace = true
operon-link.workspace = true
operon-log.workspace = true
operon-meta.workspace = true
operon-meta-tikv = { workspace = true, optional = true }
opensrv-mysql = { workspace = true, optional = true }
operon-qdrant = { workspace = true, optional = true }
operon-query.workspace = true
operon-store.workspace = true
operon-stream-grpc = { workspace = true, optional = true }
operon-tikv = { workspace = true, optional = true }
operon-worker.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
url.workspace = true

[features]
default = ["es", "flight", "hnsw", "qdrant"]
# Serve the Elasticsearch REST API (plan M1.5; `--es-listen`).
es = ["dep:operon-es"]
# The TiKV metastore (R1 plan Task 6; `--meta tikv://…` on `dev` and
# `standalone`), with the cluster MVCC GC loop it runs. Off by default (owner
# ruling T7-3): it pulls in the git-pinned tikv-client (row R4), which the
# default build must not. CI's TiKV jobs build with `--features tikv`.
tikv = ["dep:operon-meta-tikv", "dep:operon-tikv"]
# Serve Arrow Flight SQL (Task 12; `--flight-sql-listen`).
flight = []
# Serve the Qdrant REST and gRPC APIs (plan M1.4; `--qdrant-listen`).
qdrant = ["dep:operon-qdrant"]
# The qdrant-edge HNSW engine for hot artifacts (M1.3); without it the hot
# tier builds only when `ServerConfig.hnsw_engine` is set.
hnsw = ["operon-hot/hnsw"]
# Durable execution (D1, design §21): the embedded Resonate server on SQLite,
# on 127.0.0.1:8001 (--durable-*). Opt-in (owner ruling O1): toggling it
# rebuilds about 480 crates. Release builds, CI's durable jobs and the Loam
# cloud build turn it on; without it, a --durable-* flag only logs.
durable = ["dep:operon-durable"]
# The TiDB durable store through Resonate's MySQL plugin (D1 Task 4).
durable-mysql = ["durable", "operon-durable/mysql"]
# The native TiKV durable store (`--durable-store tikv://…`).
durable-tikv = ["durable", "operon-durable/tikv"]
# The MySQL wire listener over collections (`--mysql-listen`).
mysql-wire = ["dep:opensrv-mysql", "dep:datafusion"]
# The PostgreSQL wire listener over collections (`--pg-listen`).
pgwire = ["dep:datafusion-postgres", "dep:datafusion", "dep:futures"]
# The native stream gRPC endpoint used by Dapr protocol adapters.
stream-grpc = ["dep:operon-stream-grpc"]
# Builds the multi-process cluster tests (`tests/cluster.rs`, M1.3 Task 11;
# E43); CI runs them in their own job.
cluster-tests = []
# Named failpoints for the crash gate (M0.4 Task 5): with it, the binary
# reads OPERON_FAILPOINTS and OPERON_FAILPOINT_HIT. Off by default, so release
# builds contain no failpoints.
failpoints = [
    "dep:fail",
    "fail/failpoints",
    "operon-collection/failpoints",
    "operon-hot/failpoints",
    "operon-link/failpoints",
    "operon-log/failpoints",
    "operon-meta/failpoints",
]

[dev-dependencies]
arrow-array.workspace = true
arrow-flight.workspace = true
arrow-schema.workspace = true
futures.workspace = true
object_store.workspace = true
# The reference evaluator of the ES DSL tests (plan M1.5 Task 7).
operon-es = { workspace = true, features = ["test-util"] }
# The reference evaluator of the Qdrant filter tests (plan M1.4 Task 4).
operon-qdrant = { workspace = true, features = ["test-util"] }
proptest.workspace = true
prost.workspace = true
prost-types.workspace = true
tempfile.workspace = true
time.workspace = true
# The client of the PostgreSQL wire listener's tests (`pg::tests`).
tokio-postgres = "0.7"
tonic = { workspace = true, features = ["gzip"] }

[lints]
workspace = true
