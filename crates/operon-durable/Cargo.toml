[package]
name = "operon-durable"
description = "Durable execution for Operon: the Resonate server embedded in process (D1, design §21)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# The Resonate crates are git dependencies (D140), which crates.io refuses.
publish = false

[features]
default = []
# The TiDB backend through Resonate's MySQL plugin (operon's durable-mysql).
mysql = ["dep:resonate-server-mysql"]

[dependencies]
resonate-base.workspace = true
resonate-gateway-http.workspace = true
resonate-plugin.workspace = true
resonate-server-mysql = { workspace = true, optional = true }
resonate-server-sqlite.workspace = true
resonate-transport-http-poll.workspace = true
resonate-transport-http-push.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
