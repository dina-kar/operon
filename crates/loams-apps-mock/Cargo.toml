[package]
name = "loams-apps-mock"
description = "A stateful mock of the Loams app protos (loams.instance, devices, approvals, operations and notifications v1) over Connect, gRPC and gRPC-Web, with seed data, for the console, the desktop and the phone apps before the server side exists (design §37 §12, AP0 Task 5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
buffa.workspace = true
buffa-types = { version = "0.9.2", features = ["json"] }
clap.workspace = true
# `client`: the generated service clients, for this crate's tests and for
# other crates' tests that talk to the mock.
connectrpc = { workspace = true, features = ["axum", "server", "client"] }
futures.workspace = true
http.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

[build-dependencies]
connectrpc-build.workspace = true

[lints]
workspace = true
