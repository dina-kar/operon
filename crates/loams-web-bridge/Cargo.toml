[package]
name = "loams-web-bridge"
description = "The web toolbox's browser provider abstraction: the local (agent-driven) provider and the Cloudflare Browser Run remote provider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Not in the release workflow's declared crate list yet: publishing is an owner
# decision under issue #254, and this crate is consumed as a path or git
# dependency until then (AP1b's repository will take it the same way).
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
loams-web-bridge = { path = ".", features = ["test-util"] }
tempfile.workspace = true

[features]
# The deterministic drivers the conformance suite runs against. Not in a
# production build.
test-util = []

[lints]
workspace = true
