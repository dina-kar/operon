[package]
name = "operon-log"
description = "Operon's internal log: WAL objects, segments, the leaderless write path, fetch, segmenting and retention."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
crc32c.workspace = true
fail = { workspace = true, optional = true }
moka.workspace = true
operon-cache.workspace = true
operon-common.workspace = true
operon-meta.workspace = true
operon-store.workspace = true
operon-worker.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ulid.workspace = true

[features]
# Named failpoints for the crash gate (M0.4 Task 5). Off by default: without
# it the failpoints compile to nothing.
failpoints = ["dep:fail", "fail/failpoints"]

[dev-dependencies]
crc32c.workspace = true
futures.workspace = true
kafka-protocol.workspace = true
operon-meta = { workspace = true, features = ["test-util"] }
operon-worker = { workspace = true, features = ["test-util"] }
object_store.workspace = true
proptest.workspace = true
tempfile.workspace = true
ulid.workspace = true

[lints]
workspace = true
