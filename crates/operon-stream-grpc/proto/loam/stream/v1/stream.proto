syntax = "proto3";

package loam.stream.v1;

// Native stream ingest, used by protocol adapters through Dapr invocation.
service StreamService {
  rpc Produce(ProduceRequest) returns (ProduceResponse);
}

message ProduceRequest {
  string namespace = 1;
  string stream = 2;
  uint32 partition = 3;
  repeated Record records = 4;
}

message Record {
  optional bytes key = 1;
  optional bytes value = 2;
  repeated Header headers = 3;
  // A negative value asks the log writer to assign its clock.
  int64 timestamp_ms = 4;
}

message Header {
  string key = 1;
  optional bytes value = 2;
}

message ProduceResponse {
  uint64 stream_id = 1;
  uint64 base_offset = 2;
  uint64 last_offset = 3;
}
