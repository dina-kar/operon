[package]
name = "operon-tikv"
description = "Loam's TiKV client layer: keyspace-scoped transactions, the transaction runner, the tuple codec, the TSO clock, keyspace bootstrap, the cluster MVCC GC loop and the cluster test harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# tikv-client is a git dependency (R1 plan row R4), which crates.io refuses.
publish = false

[features]
# Tikv::with_faults and Tikv::inject_tso_stream_loss: the runner's fault hooks
# for tests and the fault matrix (R1 plan Tasks 2 and 6).
faults = []

[dependencies]
futures.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tikv-client.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
# tikv-client's failpoints ("after-prewrite"): tests/gc.rs leaves prewrite
# locks behind with them. Only test builds turn the feature on.
fail = { version = "0.4", features = ["failpoints"] }
# The integration tests use the fault hooks.
operon-tikv = { path = ".", features = ["faults"] }
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
