[package]
name = "operon-meta-tikv"
description = "Operon's MetaStore on TiKV: the catalog, leases, pointers and the TSO clock over operon-tikv's transaction runner (design §20 §11)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# operon-tikv depends on tikv-client by git (R1 plan row R4), which crates.io
# refuses.
publish = false

[dependencies]
async-trait.workspace = true
futures.workspace = true
operon-common.workspace = true
operon-tikv.workspace = true
postcard.workspace = true
serde.workspace = true
tokio.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
# tikv-client's own failpoints (after-prewrite, before-rollback), for the
# fault matrix's large-drop test; only test builds enable them.
fail = { version = "0.5", features = ["failpoints"] }
operon-meta-conformance.workspace = true
# The conformance backend's lose_next_ack is a FaultPlan on the handle.
operon-tikv = { workspace = true, features = ["faults"] }
tokio.workspace = true

[lints]
workspace = true
