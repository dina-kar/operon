[package]
name = "operon-live-proto"
description = "The loam.live.v1 protos of Loam Live: buffa messages and the connect-rust LiveService trait and client, generated at build time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# The generated `LiveServiceClient` (connect-rust's client transport). Off by
# default, so a server build does not pull in the client stack; Task 12's
# tests enable it.
client = ["connectrpc/client"]

[dependencies]
buffa.workspace = true
connectrpc.workspace = true
# The generated JSON mapping derives serde (connectrpc's default json feature).
serde.workspace = true

[build-dependencies]
connectrpc-build.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
