[package]
name = "loams-sqlrouter"
description = "The sans-I/O kernel of the Loams router's sharding control plane: shard maps, key ranges, shard hashes and the machine seams."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Kernel rule (§31 §7.1, D313): no tokio, sockets, files or clocks. The
# kernel_crate_has_no_io_dependencies test reads this file and fails if an I/O
# crate appears here; clippy.toml bans clocks, threads, env reads and
# unseeded randomness.
[dependencies]
des = "0.9"
postcard.workspace = true
rand_core = "0.10"
serde.workspace = true
thiserror.workspace = true
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
hex.workspace = true
proptest.workspace = true
rand = { version = "0.10", default-features = false, features = ["chacha"] }
rand_chacha.workspace = true
serde_json.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
