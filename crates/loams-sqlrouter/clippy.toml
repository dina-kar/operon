# The kernel crate does no I/O and reads no ambient state (§31 §7.1, D313).
# The driver supplies time and randomness through `Ctx`.
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "use Ctx::now" },
    { path = "std::time::SystemTime::now", reason = "use Ctx::now" },
    { path = "std::thread::spawn", reason = "machines are single-threaded" },
    { path = "std::env::var", reason = "configuration comes in as input" },
    { path = "rand::make_rng", reason = "use Ctx::rng", allow-invalid = true },
    { path = "rand::rng", reason = "use Ctx::rng", allow-invalid = true },
    { path = "rand::thread_rng", reason = "use Ctx::rng", allow-invalid = true },
]
