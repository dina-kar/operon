[package]
name = "loams-link"
description = "Loams's link framework: exactly-once apply of streams into targets, and the CounterTable test target."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
crc32c.workspace = true
fail = { workspace = true, optional = true }
futures.workspace = true
loams-common.workspace = true
loams-log.workspace = true
loams-store.workspace = true
loams-worker.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ulid.workspace = true

[features]
# Test hooks (pausing a commit at a step). Not part of the stable API.
test-util = []
# Named failpoints for the crash gate (M0.4 Task 5). Off by default: without
# it the failpoints compile to nothing.
failpoints = ["dep:fail", "fail/failpoints", "loams-log/failpoints"]

[dev-dependencies]
loams-cache.workspace = true
loams-link = { path = ".", features = ["test-util"] }
loams-meta = { workspace = true, features = ["test-util"] }
loams-worker = { workspace = true, features = ["test-util"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
