[package]
name = "operon-live"
description = "Loam Live, the reactive document database on TiKV: values, document ids, tables, indexes, the commit journal, transactions and the system functions (design §20)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# operon-tikv depends on tikv-client by git (R1 plan row R4), which crates.io
# refuses.
publish = false

[dependencies]
# The sync API's listener (Task 12); `http2` serves HTTP/2 cleartext beside
# HTTP/1.1.
axum = { workspace = true, features = ["http2"] }
buffa.workspace = true
# The connect-rust server of the sync API, mounted on axum (Task 12).
connectrpc = { workspace = true, features = ["axum"] }
crc.workspace = true
data-encoding.workspace = true
futures.workspace = true
operon-live-proto.workspace = true
operon-tikv.workspace = true
# The OS random source for document ids (rand's OsRng).
rand.workspace = true
# The idempotency key hash (design §20 §4.3).
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
# CancellationToken for the subscription manager (Task 11).
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# The generated LiveServiceClient over connect-rust's HTTP client (Task 12's
# service tests).
connectrpc = { workspace = true, features = ["axum", "client"] }
operon-live-proto = { workspace = true, features = ["client"] }
# The lost-acknowledgement tests put a FaultPlan on the handle.
operon-tikv = { workspace = true, features = ["faults"] }
proptest.workspace = true

[lints]
workspace = true
