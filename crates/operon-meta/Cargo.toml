[package]
name = "operon-meta"
description = "Operon metastore: Raft-replicated namespaces, streams, sequencer, leases and pointers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bytes.workspace = true
crc32c.workspace = true
fail = { workspace = true, optional = true }
futures.workspace = true
openraft.workspace = true
operon-common.workspace = true
operon-store.workspace = true
postcard.workspace = true
redb.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# Fault-injection hooks for tests in this and dependent crates. Not part of
# the stable API.
test-util = []
# Named failpoints for the crash gate (M0.4 Task 5). Off by default: without
# it the failpoints compile to nothing.
failpoints = ["dep:fail", "fail/failpoints"]

[dev-dependencies]
operon-meta = { path = ".", features = ["test-util"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
