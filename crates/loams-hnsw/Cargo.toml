[package]
name = "loams-hnsw"
description = "Loams's HNSW index traits, an exact flat engine and the qdrant-edge engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# The qdrant-edge engine. `loams-hot`'s feature `hnsw` enables it.
qdrant = ["dep:qdrant-edge"]

[dependencies]
crc32c.workspace = true
loams-common.workspace = true
qdrant-edge = { workspace = true, optional = true }
roaring.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# The tests run the qdrant-edge engine too.
loams-hnsw = { path = ".", features = ["qdrant"] }
qdrant-edge.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tempfile.workspace = true

[lints]
workspace = true
