[package]
name = "loams-durable"
description = "Durable execution for Loams: the Resonate server embedded in process (D1, design §21)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# The Resonate crates are git dependencies (D140), which crates.io refuses.
publish = false

[features]
default = []
# The TiDB backend through Resonate's MySQL plugin (loams's durable-mysql).
mysql = ["dep:resonate-server-mysql", "dep:rustls", "dep:sqlx"]
tikv = ["dep:loams-tikv", "dep:resonate-server-blob", "dep:uuid", "dep:resonate-core"]

[dependencies]
async-trait.workspace = true
resonate-base.workspace = true
resonate-core = { workspace = true, optional = true }
resonate-gateway-http.workspace = true
resonate-plugin.workspace = true
# Loams's own durable functions run on the Rust SDK over the in-process
# network (D141); its reqwest defaults stay off (workspace).
resonate-sdk.workspace = true
resonate-server-mysql = { workspace = true, optional = true }
resonate-server-blob = { workspace = true, optional = true }
resonate-server-sqlite.workspace = true
loams-tikv = { workspace = true, optional = true }
resonate-transport-http-poll.workspace = true
resonate-transport-http-push.workspace = true
rustls = { workspace = true, optional = true, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true, features = ["mysql", "runtime-tokio", "tls-rustls"] }
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, optional = true }

[dev-dependencies]
sqlx = { workspace = true, features = ["mysql", "runtime-tokio", "tls-rustls"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
