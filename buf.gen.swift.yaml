# Swift for Loams for iOS (design §37 §8.4, AP3 Task 1). Not run in this
# repository except as a CI smoke check into a scratch directory:
# ostrium-labs/loams-mobile runs it against the git ref pinned in its
# conformance/proto-ref.lock, for example
#
#   buf generate https://github.com/ostrium-labs/loams.git#ref=<sha>,subdir=proto \
#     --template buf.gen.swift.yaml --path loams/approvals/v1 ...
#
# Remote plugins (buf.build): swift-protobuf messages and connect-swift
# clients with async methods only.
version: v2
inputs:
  - directory: proto
    paths:
      - proto/loams/instance/v1
      - proto/loams/devices/v1
      - proto/loams/approvals/v1
      - proto/loams/operations/v1
      - proto/loams/notifications/v1
      - proto/loams/errors/v1
plugins:
  - remote: buf.build/apple/swift
    out: gen/swift
    opt:
      - Visibility=Public
      - FileNaming=PathToUnderscores
  - remote: buf.build/connectrpc/swift
    out: gen/swift
    opt:
      - Visibility=Public
      - FileNaming=PathToUnderscores
      - GenerateAsyncMethods=true
      - GenerateCallbackMethods=false
